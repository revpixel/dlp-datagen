name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Chrome extension: build, audit the package, and run the end-to-end
      # tests against the unpacked build in the runner's Chrome.
      - run: npm run ext:test
      - run: npm run ext:package
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: extension/release/*.zip
          if-no-files-found: error
